<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bobboi WVPP Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --yel:#F6CF2C; --yel-2:#FFDF5E; --yel-dark:#C9A01A; --yel-soft:#FFF4B8; --brown:#7A2A27; --green-soft:#FFF4B8;
  --cream:#FBF7EE; --ink:#141414; --muted:#6B6B6B; --line:#E6DFD0;
  --yellow:#FFF4B8; --peach:#FFE3CC; --sky:#D8E6FA; --mint:#D3F0EC; --lav:#EBDDF7; --rose:#FCDDEB;
  --red:#C2463A; --red-soft:#FAD4CF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.45}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--cream);padding:14px 0 10px;z-index:5}
.top{display:flex;align-items:center;gap:12px}
.back{width:36px;height:36px;border-radius:50%;border:none;background:#fff;box-shadow:0 1px 0 var(--line);font-size:18px;color:var(--ink);cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
.bar{flex:1;height:10px;border-radius:99px;background:#ECE5D6;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel-2),var(--yel));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.count{font-size:13px;color:var(--muted);min-width:44px;text-align:right;font-weight:500}
main{flex:1;display:flex;flex-direction:column;padding:8px 0 24px}
.screen{flex:1;display:flex;flex-direction:column;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1,h2{font-family:"DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0}
h1{font-size:32px;line-height:1.1}
h2{font-size:26px;line-height:1.15;margin:6px 0 18px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--tint,var(--green-soft));padding:6px 10px;border-radius:99px;align-self:flex-start}
.emoji{font-size:44px;margin:14px 0 4px}
.lesson{background:#fff;border-radius:22px;padding:20px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(51,85,47,.06)}
.lesson p{margin:0 0 12px}
.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.pts li{display:flex;gap:12px;align-items:flex-start}
.pts li b{color:var(--ink)}
.pip{flex:none;width:9px;height:9px;border-radius:50%;background:var(--yel);margin:8px 8px 0 9px}
.dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint,var(--green-soft));display:grid;place-items:center;font-size:14px;margin-top:1px}
.q{font-family:"DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;font-size:24px;line-height:1.2;color:var(--ink);margin:10px 0 20px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);transition:all .2s}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--yel-dark);background:var(--yel-soft)}
.opt.right .k{background:var(--yel);border-color:var(--yel-dark);color:var(--ink)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .4s}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{font:inherit;font-size:15px;padding:11px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--yel);border-color:var(--ink);color:var(--ink)}
label.lb{display:block;font-weight:700;font-size:14px;color:var(--ink);margin:0 0 8px}
input[type=text],input[type=email],textarea{width:100%;font:inherit;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;margin-bottom:20px;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:20px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ink);margin:2px 0 0;flex:none}
.foot{margin-top:auto;padding-top:20px}
.btn{width:100%;font:inherit;font-weight:700;font-size:17px;padding:17px;border:none;border-radius:18px;background:var(--yel);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--yel-dark);transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yel-dark)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 4px 0 var(--yel-dark)}
.hero{background:var(--yel);color:var(--ink);border-radius:28px;padding:28px 22px 26px;text-align:center;position:relative;overflow:hidden;margin-top:8px}
.hero .logo{width:150px;height:150px;margin:0 auto 14px;background:var(--brown);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.hero h1{color:var(--ink)}
.hero p{opacity:.9;margin:12px 0 0}
.scoops{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero>*:not(.scoops){position:relative;z-index:1}
.scoops span{position:absolute;border-radius:50%;opacity:.35}
.meta{display:flex;gap:8px;justify-content:center;margin:22px 0 4px}
.meta div{background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;color:var(--muted);text-align:center;flex:1;min-width:0;box-shadow:0 1px 0 var(--line)}
.meta b{display:block;font-size:20px;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
/* bottom sheet feedback */
.sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:20}
.sheet.show{transform:none}
.sheet .in{max-width:460px;margin:0 auto;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.08)}
.sheet.ok .in{background:var(--yel-soft)}
.sheet.no .in{background:var(--red-soft)}
.sheet h3{margin:0 0 6px;font-family:"DM Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;font-size:22px}
.sheet.ok h3{color:var(--ink)}
.sheet.no h3{color:var(--red)}
.sheet p{margin:0 0 16px}
.sheet.no .btn{background:var(--red);box-shadow:0 4px 0 #8E2F26}
/* done screen */
.done{align-items:stretch;justify-content:center;text-align:left}
.tasks{background:#fff;border-radius:22px;padding:8px 20px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(51,85,47,.06);margin:8px 0 0}
.task{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #F0EADF;color:var(--muted);transition:color .3s}
.task:last-child{border-bottom:none}
.task.active{color:var(--ink)}
.task.ok{color:var(--ink)}
.ring{flex:none;width:26px;height:26px;position:relative}
.ring svg{width:26px;height:26px;display:block}
.ring .c{fill:none;stroke:#CFC7B6;stroke-width:2}
.task.active .ring svg.o{animation:spin 1.1s linear infinite}
.task.active .ring .c{stroke:var(--ink);stroke-dasharray:4 4.2}
.ring .fill{position:absolute;inset:0;border-radius:50%;background:var(--yel);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.ring .tick{position:absolute;inset:0;display:grid;place-items:center}
.ring .tick path{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .15s}
.task.ok .ring .fill{transform:scale(1)}
.task.ok .ring .tick path{stroke-dashoffset:0}
.task.ok .ring svg.o{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.final{opacity:0;transform:translateY(16px);transition:all .6s cubic-bezier(.2,.8,.2,1);text-align:center;margin-top:26px}
.final.show{opacity:1;transform:none}
.badge{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:48px;box-shadow:0 0 0 8px #FFF9DA}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.small{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

  <header>
    <div class="top">
      <button class="back" id="back" aria-label="Back">&#8592;</button>
      <div class="bar"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet"><div class="in"><h3 id="sh-t"></h3><p id="sh-p"></p><button class="btn" id="sh-b"></button></div></div>

// Content from the WVPP Google Form v4 (FUNZIONI/HR/_LAVORO/training-e-certificazioni/2026-10-01 - WVPP - contenuto del Google Form (bozza).md)
const STEPS = [
  {t:"welcome"},
  {t:"about"},
  {t:"lesson", tint:"var(--yellow)", tag:"Our plan", title:"Our Workplace Violence Prevention Plan",
   intro:"It's designed for the risks of a gelato shop open to the public, and it follows California law.",
   pts:[["","Read it at <b>bobboi.com/bobboistaffresources</b>. A printed copy is in every shop and at the production facility."],
        ["","<b>Zero tolerance:</b> no violence or threat of violence. Firearms and other weapons are not allowed at work."],
        ["","<b>Management</b> trains employees and handles every report promptly."],
        ["","<b>You</b> follow the safety procedures, report anything suspicious and take part in training."],
        ["","Responsible: the CEO and HR Manager, the store manager of each shop, the Head of Production. Names and contacts are in the plan."]]},
  {t:"q", tint:"var(--yellow)", q:"Where can you find the Workplace Violence Prevention Plan?",
   o:["Only in the office, by asking a manager","Online at bobboi.com/bobboistaffresources and printed in every shop","Only in the employee handbook","It's only explained during training"], a:1,
   f:"The plan is online and printed in every shop and at the production facility."},
  {t:"lesson", tint:"var(--sky)", tag:"What it is", title:"Types of workplace violence",
   intro:"California law defines four types:",
   pts:[["1","<b>Type 1:</b> someone with no business at the shop who comes to commit a crime, like a robbery."],
        ["2","<b>Type 2:</b> violence by customers or visitors."],
        ["3","<b>Type 3:</b> violence by a present or former employee, supervisor or manager."],
        ["4","<b>Type 4:</b> violence by someone with a personal relationship, past or present, with an employee."]],
   outro:"It includes physical attacks with or without a weapon, threats of violence, and sexual assault or threats of sexual assault."},
  {t:"q", tint:"var(--sky)", q:"A coworker's ex-partner comes to the shop and threatens them. Which type is it?",
   o:["Type 1","Type 2","Type 3","Type 4"], a:3,
   f:"Type 4 is violence by someone who has, or had, a personal relationship with an employee."},
  {t:"lesson", tint:"var(--mint)", tag:"Prevention", title:"Prevention measures",
   pts:[["","<b>The shop:</b> good lighting, cameras at entrances, exits and cash areas, a phone for emergencies, clear escape routes."],
        ["","<b>Access:</b> only authorized staff in cash areas. Contractors and delivery people are checked first."],
        ["","<b>Cash:</b> little on hand, frequent deposits, drop-safes employees can't open."],
        ["","<b>Warning signs:</b> threats, verbal abuse or property damage can come before violence. Report them."],
        ["","<b>Hazards are fixed promptly.</b> If it can't be fixed safely, you're moved away from it."]]},
  {t:"q", tint:"var(--mint)", q:"A customer who argued with you yesterday waits outside the shop for a long time, watching you. What do you do?",
   o:["Nothing, they haven't done anything","Go outside and ask them to leave","Report it to the supervisor on shift or, if you're alone, to your manager","Wait until the end of your shift and see"], a:2,
   f:"Strange behavior can come before violence. Report it, even if nothing has happened yet."},
  {t:"lesson", tint:"var(--red-soft)", tag:"Emergency", title:"If there's immediate danger",
   pts:[["","Don't confront anyone."],["","Get away, or find a safe place to shelter."],["","Call <b>911</b>."],["","Tell your supervisor as soon as you can."]],
   outro:"In an emergency you can always use your phone to call for help or let someone know you're OK."},
  {t:"lesson", tint:"var(--red-soft)", tag:"Emergency", title:"During a robbery",
   pts:[["","<b>Your safety comes first:</b> do what the robber asks."],["","Don't try to catch or confront the robber."],["","Press the panic button <b>only if you can do it safely</b>."],["","Remember details (appearance, clothes, vehicle) without risk."],["","Call 911 when it's safe, then secure the shop and don't touch anything."],["","Write down what happened and tell your supervisor."]]},
  {t:"q", tint:"var(--red-soft)", q:"During a robbery, what comes first?",
   o:["Protecting the money in the register","Your personal safety","Getting a photo of the robber","Calling your manager"], a:1,
   f:"Do what the robber asks and don't confront them: your safety comes first."},
  {t:"q", tint:"var(--red-soft)", q:"When should you press the panic button during a robbery?",
   o:["Right away, in front of the robber","Never","Only if you can do it safely","Only after the robber has left"], a:2,
   f:"Press it only if you can do it without putting yourself at risk."},
  {t:"lesson", tint:"var(--lav)", tag:"Reporting", title:"How to report",
   pts:[["","Report any incident, threat or concern <b>right away</b> to your supervisor or to the people responsible for the plan."],
        ["","Or <b>anonymously</b> by mail: Bobboi Natural Gelato, 8008 Girard Avenue, La Jolla, CA 92037."],
        ["","<b>No retaliation</b> for reporting to Bobboi or to the police. Reports are confidential."],
        ["","Every concern is investigated, and you'll be told the results."]]},
  {t:"q", tint:"var(--lav)", q:"A coworker made a threat to you last week, but nothing else happened. What do you do?",
   o:["Nothing, only physical violence must be reported","Wait and see if it happens again","Report it to your supervisor or to the people responsible for the plan","Talk about it only with other coworkers"], a:2,
   f:"Threats are workplace violence too, and every concern should be reported."},
  {t:"q", tint:"var(--lav)", q:"Can you be punished for reporting an incident to the police?",
   o:["Yes, if you didn't tell your manager first","No, you can report without fear of retaliation","Only if the report turns out to be wrong","Yes, if it damages the company's image"], a:1,
   f:"The plan protects you from any retaliation for reporting to Bobboi or to the police."},
  {t:"lesson", tint:"var(--peach)", tag:"After an incident", title:"What happens next",
   pts:[["","<b>Support:</b> we support everyone involved."],["","<b>Investigation:</b> we look into what happened (the scene, witnesses and camera footage), find the cause and take corrective action."],["","Every incident goes in the <b>Violent Incident Log</b>, with no names or personal information."],["","The plan, the log and training records are available to you on request."],["","Serious injuries are reported to Cal/OSHA."]]},
  {t:"q", tint:"var(--peach)", q:"Which of these is NOT written in the Violent Incident Log?",

  {t:"lesson", tint:"var(--rose)", tag:"Your role", title:"You're part of the plan",

  {t:"lesson", sup:true, tint:"var(--green-soft)", tag:"Supervisors", title:"Your extra responsibilities",

const S = {i:0, name:"", email:"", loc:[], role:"", question:"", sig:"", ack:false, sel:null, solved:{}, sent:false};
const main = document.getElementById("main");
const sheet = document.getElementById("sheet");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function qCount(){ const n = STEPS.filter(s => s.t === "q"); const team = n.filter(s => !s.sup).length; return S.role ? visible().filter(s=>s.t==="q").length : (team === n.length ? team : team + "–" + n.length); }
function visible(){ return STEPS.filter(s => !s.sup || S.role === "Supervisor or Manager"); }
function cur(){ return visible()[S.i]; }

function progress(){
  const v = visible(), qs = v.filter(s => s.t === "q");
  const done = v.slice(0, S.i).filter(s => s.t === "q").length;
  document.getElementById("bar").style.width = (S.i / (v.length - 1) * 100) + "%";
  document.getElementById("count").textContent = cur().t === "q" ? (done + 1) + " / " + qs.length : "";
  document.getElementById("back").hidden = S.i === 0 || cur().t === "done";
  document.querySelector("header").style.display = cur().t === "done" ? "none" : "";
}

function go(d){ hideSheet(); S.i = Math.max(0, Math.min(visible().length - 1, S.i + d)); S.sel = null; render(); window.scrollTo(0,0); }
document.getElementById("back").onclick = () => go(-1);

function render(){
  const s = cur(); progress();
  const tint = s.tint ? ` style="--tint:${s.tint}"` : "";
  let h = "";
  if (s.t === "welcome") {
    h = `<div class="hero"><div class="logo" role="img" aria-label="Bobboi Natural Gelato" style="--logo:url(${LOGO})"></div><h1>Workplace Violence Prevention</h1><p>A training on how we keep each other safe at Bobboi.</p></div>
    <div class="meta"><div><b>~15 min</b>paid time</div><div><b>${qCount()}</b>questions</div><div><b>1×</b>a year</div></div>
    <p class="small" style="text-align:center;margin-top:14px">Required by California law.</p>
    <div class="foot"><button class="btn" onclick="go(1)">Let's start</button></div>`;
  } else if (s.t === "about") {
    const locs = ["Mission Beach","La Jolla","Little Italy","Production"], roles = ["Team member","Supervisor or Manager"];
    h = `<span class="kicker">About you</span><h2>First, tell us who you are</h2>
    <label class="lb">Full name</label><input type="text" id="nm" value="${esc(S.name)}" placeholder="Your first and last name">
    <label class="lb">Email</label><input type="email" id="em" value="${esc(S.email)}" placeholder="you@email.com">
    <label class="lb">Where do you work?</label><p class="small" style="margin:-4px 0 10px">Select all that apply</p><div class="chips">${locs.map(l=>`<button class="chip ${S.loc.includes(l)?"sel":""}" data-k="loc" data-v="${l}">${l}</button>`).join("")}</div>
    <label class="lb">Your role</label><div class="chips">${roles.map(l=>`<button class="chip ${S.role===l?"sel":""}" data-k="role" data-v="${l}">${l}</button>`).join("")}</div>
    <div class="foot"><button class="btn" id="nx">Continue</button></div>`;
  } else if (s.t === "lesson") {
    h = `<span class="kicker"${tint}>${s.tag}</span><h2>${s.title}</h2>
    <div class="lesson"${tint}>${s.intro?`<p>${s.intro}</p>`:""}<ul class="pts">${s.pts.map(p=>`<li>${/^\d$/.test(p[0])?`<span class="dot">${p[0]}</span>`:`<span class="pip"></span>`}<span>${p[1]}</span></li>`).join("")}</ul>${s.outro?`<p style="margin:14px 0 0">${s.outro}</p>`:""}</div>
    <div class="foot"><button class="btn" onclick="go(1)">Got it</button></div>`;
  } else if (s.t === "q") {
    const solved = S.solved[s.q];
    h = `<span class="kicker"${tint}>Question</span><div class="q">${s.q}</div>
    <div class="opts">${s.o.map((o,j)=>`<button class="opt ${solved&&j===s.a?"right":""} ${solved&&j!==s.a?"dim":""}" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div>
    <div class="foot"><button class="btn" id="chk" ${solved?"":"disabled"}>${solved?"Continue":"Check"}</button></div>`;
  } else if (s.t === "sign") {
    h = `<span class="kicker">Almost done</span><h2>Any questions about the plan?</h2>
    <textarea id="qa" placeholder="Optional. Simone will answer by email within 48 hours.">${esc(S.question)}</textarea>
    <label class="check"><input type="checkbox" id="ack" ${S.ack?"checked":""}><span>I have completed the Workplace Violence Prevention training. I know where to find the plan, how to report and what to do in an emergency.</span></label>
    <label class="lb">Type your full name as your signature</label><input type="text" id="sig" value="${esc(S.sig)}" placeholder="${esc(S.name)||"Full name"}">
    <div class="foot"><button class="btn" id="sub" disabled>Submit</button></div>`;
  } else if (s.t === "done") {
    h = `<div class="screen done" style="animation:none">
      <span class="kicker">Finishing up</span><h2>Wrapping up your training</h2>
      <div class="tasks">
        <div class="task" id="t0">${ring()}<span>Saving your answers</span></div>
        <div class="task" id="t1">${ring()}<span>Recording your training</span></div>
        <div class="task" id="t2">${ring()}<span>Notifying HR</span></div>
      </div>
      <div id="err" style="display:none;margin-top:18px"><p class="small" style="color:var(--red);margin:0 0 12px">We couldn't save your training. Check your connection and try again.</p><button class="btn" id="retry">Try again</button></div>
      <div class="final" id="fin"><h1>You're all set${S.name?", "+esc(S.name.split(" ")[0]):""}!</h1>
      <p class="small" style="margin-top:10px">15 minutes of paid training time will be added to your timesheet.</p>
      <p class="small" style="margin-top:6px">Thanks for keeping Bobboi safe. If you asked a question, you'll get an answer by email within 48 hours.</p></div>
    </div>`;
  }
  main.innerHTML = s.t === "done" ? h : `<div class="screen">${h}</div>`;
  wire(s);
}

function ring(){ return `<span class="ring"><svg class="o" viewBox="0 0 26 26"><circle class="c" cx="13" cy="13" r="11"/></svg><span class="fill"></span><span class="tick"><svg viewBox="0 0 26 26" width="26" height="26"><path d="M8 13.5l3.3 3.2L18 10"/></svg></span></span>`; }
function scoops(){ const c=["#FFFFFF","#FFF4B8","#FFFFFF","#FFDF5E","#FFFFFF"]; return `<div class="scoops">${[[-30,-30,120],[260,-20,90],[300,150,130],[-40,170,100],[150,230,70]].map((p,i)=>`<span style="left:${p[0]}px;top:${p[1]}px;width:${p[2]}px;height:${p[2]}px;background:${c[i]}"></span>`).join("")}</div>`; }

function wire(s){
  if (s.t === "about") {
    const ok = () => document.getElementById("nx").disabled = !(S.name.trim() && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email.trim()) && S.loc.length && S.role);
    document.getElementById("nm").oninput = e => { S.name = e.target.value; ok(); };
    document.getElementById("em").oninput = e => { S.email = e.target.value; ok(); };
    main.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      if (b.dataset.k === "loc") { // piu' sedi possibili
        const v = b.dataset.v, i = S.loc.indexOf(v);
        if (i < 0) S.loc.push(v); else S.loc.splice(i, 1);
        b.classList.toggle("sel", i < 0);
      } else { S[b.dataset.k] = b.dataset.v; b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel", x===b)); }
      ok();
    });
    document.getElementById("nx").onclick = () => go(1); ok();
  }
  if (s.t === "q") {
    const btn = document.getElementById("chk"), opts = [...main.querySelectorAll(".opt")];
    if (S.solved[s.q]) { btn.onclick = () => go(1); return; }
    opts.forEach(o => o.onclick = () => { opts.forEach(x=>x.classList.remove("sel","wrong")); o.classList.add("sel"); S.sel = +o.dataset.j; btn.disabled = false; });
    btn.onclick = () => {
      const o = opts[S.sel];
      if (S.sel === s.a) {
        o.classList.remove("sel"); o.classList.add("right"); opts.forEach(x=>{ if(x!==o) x.classList.add("dim"); });
        S.solved[s.q] = true; burst(18);
        showSheet("ok", pick(["Nice one! 🎉","Exactly right!","You got it! ✨"]), s.f, "Continue", () => go(1));
      } else {
        o.classList.remove("sel"); o.classList.add("wrong");
        showSheet("no", "Not quite", s.f, "Try again", () => { hideSheet(); o.classList.remove("wrong"); o.classList.add("dim"); o.disabled = true; S.sel = null; btn.disabled = true; });
      }
    };
  }
  if (s.t === "sign") {
    const sub = document.getElementById("sub"), ack = document.getElementById("ack"), sig = document.getElementById("sig");
    const ok = () => { S.ack = ack.checked; S.sig = sig.value; sub.disabled = !(ack.checked && sig.value.trim()); };
    document.getElementById("qa").oninput = e => { S.question = e.target.value; };
    ack.onchange = ok; sig.oninput = ok; sub.onclick = () => go(1); ok();
  }
  if (s.t === "done") runTasks();
}

// Il primo punto gira finche' il foglio registro non ha salvato davvero; gli altri due seguono.
function runTasks(){
  const el = id => document.getElementById(id);
  const tick = id => { el(id).classList.remove("active"); el(id).classList.add("ok"); };
  const finish = () => {
    tick("t0"); el("t1").classList.add("active");
    setTimeout(() => { tick("t1"); el("t2").classList.add("active"); }, 1100);
    setTimeout(() => { tick("t2"); }, 2200);
    setTimeout(() => { el("fin").classList.add("show"); burst(90); }, 2650);
  };
  const send = () => {
    el("err").style.display = "none"; el("t0").classList.add("active");
    const started = Date.now(), minWait = 1200;
    const ok = () => { S.sent = true; setTimeout(finish, Math.max(0, minWait - (Date.now() - started))); };
    const fail = () => { el("t0").classList.remove("active"); el("err").style.display = ""; };
    const data = {name:S.name, email:S.email, location:S.loc.join(", "), role:S.role, question:S.question, signature:S.sig, ack:S.ack};
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(ok).withFailureHandler(fail).submitTraining(data);
    else if (/^https?:$/.test(location.protocol))
      // Pagina su GitHub Pages: POST allo script senza cookie, cosi' il login Google del dipendente non conta.
      fetch(SAVE_URL, {method:"POST", body:JSON.stringify(data), headers:{"Content-Type":"text/plain;charset=utf-8"}, credentials:"omit", redirect:"follow"})
        .then(r => r.json()).then(j => j.ok ? ok() : fail()).catch(fail);
    else setTimeout(ok, 800); // file aperto in locale (prova): nessun salvataggio
  };
  el("retry").onclick = send;
  if (!S.sent) setTimeout(send, 400);
}

function showSheet(kind, t, p, b, fn){ sheet.className = "sheet show " + kind; document.getElementById("sh-t").textContent = t; document.getElementById("sh-p").textContent = p; const bt = document.getElementById("sh-b"); bt.textContent = b; bt.onclick = fn; }
function hideSheet(){ sheet.className = "sheet"; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function burst(n){
  const c = document.createElement("div"); c.className = "confetti"; document.body.appendChild(c);
  const col = ["#141414","#F6CF2C","#FFF4B8","#FAD4CF","#D8E6FA","#D3F0EC","#FFE3CC","#EBDDF7"];
  for (let i=0;i<n;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"%"; e.style.background=col[i%col.length]; e.style.animationDuration=(1.4+Math.random()*1.4)+"s"; e.style.animationDelay=Math.random()*.3+"s"; c.appendChild(e); }
  setTimeout(()=>c.remove(), 3500);
}

render();
</script>
</body>
</html>
